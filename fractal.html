let pts=[[-1,-.58],[1,-.58],[0,1.152]],segs=[];function koch(a,b,d){if(!d){segs.push([a,b]);return}let dx=(b[0]-a[0])/3,dy=(b[1]-a[1])/3,p1=[a[0]+dx,a[1]+dy],p3=[a[0]+2*dx,a[1]+2*dy],p2=[(a[0]+b[0])/2+dy*Math.sqrt(3)/2,(a[1]+b[1])/2-dx*Math.sqrt(3)/2];koch(a,p1,d-1);koch(p1,p2,d-1);koch(p2,p3,d-1);koch(p3,b,d-1)}for(let i=0;i<3;i++)koch(pts[i],pts[(i+1)%3],level);let poly=segs.map(s=>s[0]);
function area2(p){let a=0;for(let i=0;i<p.length;i++){let q=p[(i+1)%p.length];a+=p[i][0]*q[1]-q[0]*p[i][1]}return a}if(area2(poly)<0)poly.reverse();function inside(p,a,b,c){let s=(u,v,w)=>(u[0]-w[0])*(v[1]-w[1])-(v[0]-w[0])*(u[1]-w[1]),d1=s(p,a,b),d2=s(p,b,c),d3=s(p,c,a);return d1>=-1e-8&&d2>=-1e-8&&d3>=-1e-8}function triangulate(p){let ids=p.map((_,i)=>i),out=[],guard=0;while(ids.length>3&&guard++<p.length*p.length){let cut=false;for(let k=0;k<ids.length;k++){let ia=ids[(k-1+ids.length)%ids.length],ib=ids[k],ic=ids[(k+1)%ids.length],a=p[ia],b=p[ib],c=p[ic],cross=(b[0]-a[0])*(c[1]-b[1])-(b[1]-a[1])*(c[0]-b[0]);if(cross<=1e-10)continue;let hit=false;for(let j of ids){if(j===ia||j===ib||j===ic)continue;if(inside(p[j],a,b,c)){hit=true;break}}if(!hit){out.push([ia,ib,ic]);ids.splice(k,1);cut=true;break}}if(!cut)break}if(ids.length===3)out.push([ids[0],ids[1],ids[2]]);return out}let ti=triangulate(poly),z=.075+explode*.16,top=poly.map(p=>[p[0],p[1],z]),bottom=poly.map(p=>[p[0],p[1],-z]);for(let t of ti){face(top[t[0]],top[t[1]],top[t[2]]);face(bottom[t[2]],bottom[t[1]],bottom[t[0]])}for(let i=0;i<poly.length;i++){let j=(i+1)%poly.length;quad(top[i],bottom[i],bottom[j],top[j]);lines.push(...top[i],...top[j],...bottom[i],...bottom[j]);if(i%(4**Math.max(0,level-2))===0)lines.push(...top[i],...bottom[i])}}
